<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daily inspirational quotes with persistent favorites in localStorage">
  <title>Quote of the Day</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="app-container">
    <header class="app-header">
      <h1 class="app-title">Quote of the Day</h1>
      <p class="app-subtitle">Daily inspiration at your fingertips</p>
    </header>

    <figure id="quote-card" class="quote-card" aria-live="polite" aria-atomic="true">
      <div class="quote-glyph" aria-hidden="true">“</div>
      <blockquote id="quote-text" class="quote-text">Loading inspiration...</blockquote>
      <figcaption id="quote-author" class="quote-author">— Please wait</figcaption>

      <div class="card-actions">
        <button id="favorite-btn" class="btn btn-favorite" type="button" aria-pressed="false" title="Toggle favorite">
          <span class="favorite-icon" aria-hidden="true">★</span>
          <span id="favorite-label" class="favorite-label">Favorite</span>
        </button>

        <button id="new-quote-btn" class="btn btn-primary" type="button">
          <span class="btn-icon" aria-hidden="true">↻</span>
          <span>New quote</span>
        </button>
      </div>
    </figure>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
